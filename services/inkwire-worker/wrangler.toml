name = "inkwire-worker"
main = "src/index.ts"
compatibility_date = "2024-09-01"
account_id = "a4539a8af2c5faa89b6c222f533a0de7"

[triggers]
crons = ["0 6 * * *"]

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "EDITION_KV"
id = "fed22fa4f0ed4cc48a21e3cceb1aa74f"

[vars]
WEATHER_CITY = "London"
WEATHER_LAT = "51.5074"
WEATHER_LON = "-0.1278"
# Set via `npx wrangler secret put GEMINI_API_KEY` if you want Google Gemini 1.5 Flash
# Otherwise the worker defaults to Cloudflare Workers AI (@cf/meta/llama-3.1-8b-instruct)
